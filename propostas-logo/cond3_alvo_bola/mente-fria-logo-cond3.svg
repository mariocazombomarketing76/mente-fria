<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="Mente Fria - Alvo + Bola de Futebol">
  <title>Mente Fria - Alvo (bullseye) combinado com uma bola de futebol</title>
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#151b25"/>
      <stop offset="1" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="cyan3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22e5ff"/>
      <stop offset="1" stop-color="#00d4ff"/>
    </linearGradient>
  </defs>
  <rect x="16" y="16" width="480" height="480" rx="96" fill="url(#bg3)" stroke="url(#cyan3)" stroke-width="10"/>
  <!-- Alvo -->
  <g transform="translate(256,230)">
    <circle r="130" fill="none" stroke="url(#cyan3)" stroke-width="10"/>
    <circle r="95" fill="none" stroke="url(#cyan3)" stroke-width="10" opacity="0.8"/>
    <circle r="62" fill="none" stroke="url(#cyan3)" stroke-width="10" opacity="0.6"/>
    <circle r="32" fill="none" stroke="url(#cyan3)" stroke-width="10" opacity="0.4"/>
    <!-- Traços de mira -->
    <line x1="-150" y1="0" x2="-130" y2="0" stroke="url(#cyan3)" stroke-width="12" stroke-linecap="round"/>
    <line x1="150" y1="0" x2="130" y2="0" stroke="url(#cyan3)" stroke-width="12" stroke-linecap="round"/>
    <line x1="0" y1="-150" x2="0" y2="-130" stroke="url(#cyan3)" stroke-width="12" stroke-linecap="round"/>
    <line x1="0" y1="150" x2="0" y2="130" stroke="url(#cyan3)" stroke-width="12" stroke-linecap="round"/>
    <!-- Bola central -->
    <circle r="16" fill="url(#cyan3)"/>
    <g stroke="#0d1117" stroke-width="3">
      <line x1="0" y1="-16" x2="0" y2="16"/>
      <line x1="-16" y1="0" x2="16" y2="0"/>
      <circle r="16" fill="none"/>
    </g>
  </g>
  <text x="256" y="450" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700" text-anchor="middle" fill="#00d4ff" letter-spacing="6px">MENTE FRIA</text>
</svg>
